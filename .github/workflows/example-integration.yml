# Integration test of the reusable workflows.
#
# The reusable workflows of this repository are called on small fixture projects
# (tests/fixtures/) and on the example service (examples/python-service/), exactly like a
# project repository would call them.
# If this workflow fails, a change in a reusable workflow would break the projects.
name: Reusable workflows integration

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/fixtures/**"
      - "examples/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tests/fixtures/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-fixture:
    name: python-ci on the Python fixture
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-minimal
      python-version: "3.12"
      coverage-fail-under: 90
      coverage-artifact-name: coverage-python-fixture

  node-fixture:
    name: node-ci on the Node fixture
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/node-minimal
      coverage-path: coverage/lcov.info
      coverage-artifact-name: coverage-node-fixture

  security-fixtures:
    name: security on the fixtures
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
    with:
      scan-secrets: false
      python-working-directory: tests/fixtures/python-minimal
      node-working-directory: tests/fixtures/node-minimal

  sonar-fixtures:
    name: sonar on the fixtures
    needs: [python-fixture, node-fixture]
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
    # No SONAR_TOKEN is passed: the fixtures are not SonarQube Cloud projects. The workflow
    # restores both coverage reports and skips the analysis, which is what is tested here.
    with:
      python-working-directory: tests/fixtures/python-minimal
      python-coverage-artifact: coverage-python-fixture
      node-working-directory: tests/fixtures/node-minimal
      node-coverage-artifact: coverage-node-fixture

  example-service:
    name: python-ci on the example service
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: examples/python-service
      run-import-linter: true
      coverage-fail-under: 95
      coverage-artifact-name: coverage-python-example

  example-docker:
    name: docker on the example service
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
    with:
      context: examples/python-service
      image: qa-service-example

  example-container:
    name: Example container answers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag qa-service:test examples/python-service
      - name: Check that the container runs as a non-root user
        run: test "$(docker run --rm --entrypoint id qa-service:test -u)" != "0"
      - name: Start the container and call the API
        run: |
          set -euo pipefail
          docker run --detach --name qa --publish 8000:8000 qa-service:test
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/answers \
            --header 'content-type: application/json' \
            --data '{"question": "Which tool manages Python dependencies?"}' | tee answer.json
          grep -q '"python-tooling"' answer.json
      - name: Show the container logs
        if: always()
        run: docker logs qa || true
