# Release of the engineering-standards repository itself (dogfooding of release-please.yml).
#
# release-please keeps a release PR open; merging it creates the vX.Y.Z tag and the GitHub
# Release, and moves the v1 tag that projects use to call the reusable workflows (REL-008).
#
# The first release is 1.0.0 ("release-as" in release-please-config.json). Remove
# "release-as" in the PR that follows the first release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      move-major-tag: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
