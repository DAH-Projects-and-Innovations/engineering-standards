# Reusable workflow: Node.js / TypeScript CI with pnpm (lint, format, type check, tests, build).
#
# Call it from a project repository (see templates/github/workflows/ci.yml):
#
#   jobs:
#     frontend:
#       uses: DAH-Projects-and-Innovations/engineering-standards/.github/workflows/node-ci.yml@v1
#       with:
#         working-directory: frontend
#
# The project MUST define these package.json scripts (rule JS-007):
# lint, format:check, typecheck, test, build.
# Rules covered: JS-001 to JS-005, JS-007, CI-003 to CI-008. See docs/standards/ci-cd.md.
name: Node CI (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains package.json, pnpm-lock.yaml and .nvmrc.
        type: string
        default: "."
      node-version-file:
        description: File that pins the Node.js version, relative to the working directory.
        type: string
        default: ".nvmrc"
      run-lint:
        description: Run `pnpm run lint`.
        type: boolean
        default: true
      run-format-check:
        description: Run `pnpm run format:check`.
        type: boolean
        default: true
      run-typecheck:
        description: Run `pnpm run typecheck`.
        type: boolean
        default: true
      run-test:
        description: Run `pnpm run test`.
        type: boolean
        default: true
      run-build:
        description: Run `pnpm run build`.
        type: boolean
        default: true
      coverage-path:
        description: >-
          Path of the LCOV report produced by the tests, relative to the working directory
          (for example coverage/lcov.info). Empty means no upload.
        type: string
        default: ""
      coverage-artifact-name:
        description: Name of the coverage artifact.
        type: string
        default: coverage-node
      timeout-minutes:
        description: Maximum duration of the job.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from the packageManager field)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies from the lock file
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run-lint
        run: pnpm run lint

      - name: Check formatting
        if: inputs.run-format-check
        run: pnpm run format:check

      - name: Type check
        if: inputs.run-typecheck
        run: pnpm run typecheck

      - name: Test
        if: inputs.run-test
        run: pnpm run test

      - name: Build
        if: inputs.run-build
        run: pnpm run build

      - name: Upload the coverage report
        if: inputs.coverage-path != '' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-path }}
          if-no-files-found: warn
          retention-days: 7
