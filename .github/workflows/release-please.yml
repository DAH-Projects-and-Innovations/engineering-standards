# Reusable workflow: release-please keeps a release PR open on main and, when it is merged,
# creates the vX.Y.Z tag, the GitHub Release and the CHANGELOG entry.
#
# Call it on every push to main (see templates/github/workflows/release.yml):
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: DAH-Projects-and-Innovations/engineering-standards/.github/workflows/release-please.yml@v1
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#       with:
#         app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
#       secrets:
#         app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# Use a GitHub App token (app-client-id + app-private-key): pull requests and tags created with
# the default GITHUB_TOKEN do not start other workflows, so the required checks would never run
# on the release PR. Without the App, the workflow falls back to GITHUB_TOKEN; then close and
# reopen the release PR by hand to start the checks. See docs/standards/releases.md.
#
# The versions and the CHANGELOG sections are configured in release-please-config.json and
# .release-please-manifest.json at the root of the repository (rule REL-004).
#
# Rules covered: REL-001 to REL-006. See docs/standards/releases.md.
name: release-please (reusable)

on:
  workflow_call:
    inputs:
      config-file:
        description: Path of the release-please configuration.
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path of the release-please manifest (current versions).
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: Branch of the release PR. Empty means the default branch.
        type: string
        default: ""
      app-client-id:
        description: Client ID of the GitHub App used to open the release PR. Empty means GITHUB_TOKEN.
        type: string
        default: ""
      move-major-tag:
        description: >-
          After a release, move the vMAJOR tag (for example v1) to the new release. For
          repositories that publish reusable workflows or actions.
        type: boolean
        default: false
      timeout-minutes:
        description: Maximum duration of the job.
        type: number
        default: 10
    secrets:
      app-private-key:
        description: Private key of the GitHub App.
        required: false
    outputs:
      release_created:
        description: "`true` when a release of the root component was created."
        value: ${{ jobs.release-please.outputs.release_created }}
      releases_created:
        description: "`true` when any release was created."
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        description: JSON array of the released paths (monorepos).
        value: ${{ jobs.release-please.outputs.paths_released }}
      tag_name:
        description: Tag of the root release, for example `v1.4.0`.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of the root release, for example `1.4.0`.
        value: ${{ jobs.release-please.outputs.version }}
      sha:
        description: Commit of the root release.
        value: ${{ jobs.release-please.outputs.sha }}

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
    steps:
      - name: Create a GitHub App token
        id: app-token
        if: inputs.app-client-id != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Warn when the App is not configured
        if: steps.app-token.outcome != 'success'
        run: >-
          echo "::warning title=release-please::No GitHub App token. The release PR is
          created with GITHUB_TOKEN, so its checks do not start: close and reopen it by hand."

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

      - name: Check out the release commit
        if: inputs.move-major-tag && steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true # needed to push the moved tag

      - name: Move the major version tag
        if: inputs.move-major-tag && steps.release.outputs.release_created == 'true'
        env:
          MAJOR: v${{ steps.release.outputs.major }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "$MAJOR" --message "Latest ${MAJOR}.x.y release: ${TAG}" "$SHA"
          git push --force origin "refs/tags/${MAJOR}"
          echo "::notice::${MAJOR} now points to ${TAG}."
