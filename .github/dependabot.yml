# Dependabot configuration of the engineering-standards repository.
version: 2

updates:
  # Actions used by the reusable workflows and the CI of this repository.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      hooks:
        patterns: ["*"]

  # Fixtures: updated monthly; they only need to stay installable.
  - package-ecosystem: uv
    directory: /tests/fixtures/python-minimal
    schedule:
      interval: monthly
    commit-message:
      prefix: test
      include: scope
    labels: [dependencies]
    groups:
      fixture-python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/fixtures/node-minimal
    schedule:
      interval: monthly
    commit-message:
      prefix: test
      include: scope
    labels: [dependencies]
    groups:
      fixture-node:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node LTS version (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint 8 does not support TypeScript 7 yet; move in a planned PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Example service: monthly, like the fixtures.
  - package-ecosystem: uv
    directory: /examples/python-service
    schedule:
      interval: monthly
    commit-message:
      prefix: test
      include: scope
    labels: [dependencies]
    groups:
      example-python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /examples/python-service
    schedule:
      interval: monthly
    commit-message:
      prefix: test
      include: scope
    labels: [dependencies]
