# pre-commit configuration of the engineering-standards repository (dogfooding).
# Install once:  uvx pre-commit install
# Run on all files:  uvx pre-commit run --all-files
# Hook versions are updated by Dependabot (package-ecosystem: pre-commit).
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^LICENSE$

repos:
  # Generic file hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # pnpm 12 lock files contain several YAML documents.
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secrets.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Markdown style.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint

  # YAML style.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # GitHub Actions workflows.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # GitHub files validated against their JSON schemas (SchemaStore), templates included.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
        files: ^(\.github/workflows|templates/github/workflows)/.*\.ya?ml$
      - id: check-dependabot
        files: ^(\.github|templates/github)/dependabot\.ya?ml$
      - id: check-github-issue-forms
        files: ^(\.github|templates/github)/ISSUE_TEMPLATE/(?!config\.).*\.ya?ml$
      - id: check-github-issue-config
        files: ^(\.github|templates/github)/ISSUE_TEMPLATE/config\.ya?ml$
      - id: check-citation-file-format
        files: ^templates/docs/CITATION\.cff$

  # Relative links and anchors in Markdown (offline; external links are checked in CI).
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        args: [--offline, --no-progress]
        types: [markdown]

  # Python code of this repository (hooks, scripts, fixtures).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock
        name: uv-lock (Python fixture)
        files: ^tests/fixtures/python-minimal/(uv\.lock|pyproject\.toml)$
        args: [--project, tests/fixtures/python-minimal, --check]

  # Commit messages: Conventional Commits 1.0.0.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  - repo: local
    hooks:
      - id: rules-matrix
        name: Generate docs/compliance/rules-matrix.md
        entry: python scripts/generate_rules_matrix.py
        language: python
        files: ^(docs/(standards/.*|getting-started/first-day|compliance/levels)\.md|scripts/generate_rules_matrix\.py)$
        pass_filenames: false
      - id: dah-branch-name
        name: Check branch name (DAH Labs convention)
        entry: hooks/check_branch_name.py
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: hook-tests
        name: Unit tests of the hooks and scripts
        entry: uv run --no-project --with pytest==9.2.0 pytest -q tests/hooks
        language: system
        files: ^(hooks|scripts|tests/hooks)/
        pass_filenames: false
        stages: [pre-push]
