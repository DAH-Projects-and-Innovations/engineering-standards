# yamllint configuration: https://yamllint.readthedocs.io
extends: default
rules:
  line-length:
    max: 120
    level: warning
  # GitHub Actions uses the key "on", which YAML 1.1 reads as a boolean.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
ignore: |
  node_modules/
  .venv/
  pnpm-lock.yaml
