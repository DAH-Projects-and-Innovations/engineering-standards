# DAH Labs OpenSSF Scorecard template (rule SEC-013, Level 3).
# Copy to .github/workflows/scorecard.yml. This workflow MUST stay standalone (not reusable) and
# follow the Scorecard workflow restrictions: https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1" # Every Monday.
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # Upload results to code scanning.
      id-token: write # Publish results to the OpenSSF API.
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
