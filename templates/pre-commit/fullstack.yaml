# DAH Labs pre-commit template: full-stack repository with backend/ (Python, uv) and
# frontend/ (TypeScript, pnpm). Rules HOOK-*, see docs/standards/git-hooks.md.
# Copy to .pre-commit-config.yaml at the root of the repository, then run once:
#   uvx pre-commit install
#   uvx pre-commit run --all-files
# The front-end hooks use the tools installed in frontend/node_modules: run
# `pnpm --dir frontend install` first. Versions ("rev") are updated by Dependabot.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # --- pre-commit stage: fast checks on the staged files (target: less than 10 seconds) ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm 12 lock files have several documents.
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$ # tsconfig files may contain comments.
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Back end.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5 # TODO: keep the same version as ruff in backend/pyproject.toml.
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.8
    hooks:
      - id: uv-lock
        files: ^backend/(uv\.lock|pyproject\.toml)$
        args: [--project, backend, --check]

  # Dockerfiles (hadolint binary from PyPI, no Docker needed).
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  # Front end: uses the versions of frontend/package.json (one source of truth).
  - repo: local
    hooks:
      - id: prettier
        name: prettier (front end)
        entry: pnpm --dir frontend run format
        language: system
        files: ^frontend/
        pass_filenames: false

  # --- commit-msg stage -------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # --- pre-push stage ---------------------------------------------------------------------
  - repo: https://github.com/DAH-Projects-and-Innovations/engineering-standards
    rev: v1.0.0 # TODO: latest release of the DAH Labs engineering standards.
    hooks:
      - id: dah-branch-name

  - repo: local
    hooks:
      - id: mypy
        name: mypy (back end)
        entry: uv --directory backend run --frozen mypy
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]
      - id: pytest-unit
        name: pytest (back end, fast unit tests)
        entry: >-
          uv --directory backend run --frozen pytest -q
          -m "not slow and not integration and not requires_gpu and not requires_api_key"
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [pre-push]
      - id: eslint
        name: eslint (front end)
        entry: pnpm --dir frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
      - id: typecheck-frontend
        name: tsc (front end)
        entry: pnpm --dir frontend run typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-push]
