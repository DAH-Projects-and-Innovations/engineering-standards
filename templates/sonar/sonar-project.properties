# DAH Labs SonarQube Cloud configuration template (rules FILE-019, SONAR-003).
# Copy to sonar-project.properties at the root of the repository and fill the TODO markers.
# Read by the sonar.yml reusable workflow. Paths are relative to the repository root.
# Remove the lines of the parts that your repository does not have.

# Organization and project keys: SonarQube Cloud shows them in Administration > General.
sonar.organization=dah-projects-and-innovations
sonar.projectKey=DAH-Projects-and-Innovations_TODO-repository
sonar.projectName=TODO repository name

# Analysis scope: production code in sources, test code in tests.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/migrations/**,**/*.generated.*
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript and TypeScript (the old sonar.typescript.lcov.reportPaths is deprecated)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Files not counted in coverage (entry points and configuration only, never business code)
sonar.coverage.exclusions=frontend/src/main.tsx,**/*.config.ts,**/*.config.js
