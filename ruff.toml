# Ruff configuration for the Python code of this repository (hooks/, scripts/, tests/).
# Projects use templates/python/pyproject.toml instead.
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "PT", "RUF", "T20", "PL", "C90"]
ignore = [
  "S603", # subprocess calls use fixed argument lists.
  "S607", # `git` is resolved from PATH on purpose.
]

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Command line scripts print their results.
"{hooks,scripts}/**" = ["T201"]

[lint.mccabe]
max-complexity = 10
